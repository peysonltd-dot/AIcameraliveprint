    <style>
        :root {
            --ai-cyan: #ff6b21;
            --ai-pink: #ffc400;
            --ai-dark: #17130f;
            --tourism-orange: #ff6b21;
            --tourism-cream: #fff8ef;
            --tourism-ink: #221a14;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--ai-dark);
        }
        body {
            touch-action: pan-x pan-y;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
        }
        .cyber-bg {
            background:
                radial-gradient(circle at 12% 12%, rgba(255, 196, 0, 0.24), transparent 25%),
                radial-gradient(circle at 88% 20%, rgba(255, 107, 33, 0.32), transparent 28%),
                linear-gradient(155deg, #17130f 0%, #2a180e 48%, #4a210f 100%);
            position: relative;
        }
        .cyber-bg::before,
        .cyber-bg::after {
            content: '';
            position: fixed;
            left: -15vw;
            width: 130vw;
            height: 22vw;
            min-height: 150px;
            border: 2px solid rgba(255, 107, 33, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }
        .cyber-bg::before { bottom: 8vh; transform: rotate(-7deg); }
        .cyber-bg::after { bottom: -2vh; transform: rotate(5deg); border-color: rgba(255, 196, 0, 0.13); }

        .kv-title {
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
            background: linear-gradient(to bottom, #fff 30%, #ffd6be 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 107, 33, 0.45));
        }
        .glow-bar {
            height: 4px;
            width: 320px;
            background: linear-gradient(90deg, transparent, #ffc400, var(--tourism-orange), transparent);
            box-shadow: 0 0 16px rgba(255, 196, 0, 0.28), 0 0 28px rgba(255, 107, 33, 0.36);
            border-radius: 50%;
        }
        .content-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            padding-top: 0.5rem;

        @media (min-height: 1100px) and (max-aspect-ratio: 10/16) {
            .content-container { justify-content: flex-start; padding-top: 1.5rem; }
        }
        .camera-container {
            width: 80vw; height: 80vw; max-width: 750px; max-height: 750px;
            position: relative; overflow: hidden; border-radius: 2rem;
            border: 4px solid var(--ai-cyan);
            box-shadow: 0 0 45px rgba(255, 107, 33, 0.38);
            background-color: #000; transition: all 0.3s ease-in-out;
        }
        @media (min-height: 1100px) {
            .camera-container { max-width: 750px; max-height: 750px; }
        }
        .choice-card {
            border: 4px solid #1e293b;
            background: rgba(34, 26, 20, 0.78);
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }
        .choice-card.selected {
            border-color: var(--ai-cyan);
            box-shadow: 0 0 45px rgba(255, 107, 33, 0.44);
            background: rgba(255, 107, 33, 0.15);
            transform: scale(1.04);
        }
        .face-guide {
            width: 55%; aspect-ratio: 1 / 1.35; border-radius: 50%;
            border: 4px solid var(--ai-cyan);
            box-shadow: 0 0 25px var(--ai-cyan), 0 0 0 9999px rgba(23, 19, 15, 0.62);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        .radar-spinner {
            position: relative; width: 240px; height: 240px;
            border-radius: 50%; border: 3px dashed rgba(255, 107, 33, 0.5);
            animation: spin 8s linear infinite;
        }
        .radar-spinner::before {
            content: ''; position: absolute; inset: 18px; border-radius: 50%;
            border: 6px solid transparent; border-top-color: var(--ai-cyan); border-bottom-color: var(--ai-cyan);
            animation: spin 2s linear infinite reverse;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text-glow-pulse { animation: pulse-glow 2s ease-in-out infinite; }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; text-shadow: 0 0 25px var(--ai-cyan); } 50% { opacity: 0.6; text-shadow: 0 0 10px var(--ai-cyan); } }
        .btn-cyan {
            background: rgba(255, 107, 33, 0.12); border: 2.5px solid var(--ai-cyan); color: #ff9b68;
            letter-spacing: 2px; transition: all 0.3s; box-shadow: 0 0 20px rgba(255, 107, 33, 0.22);
            position: relative;
            z-index: 10;
        }
        .btn-cyan:active:not(:disabled) { background: var(--ai-cyan); color: #fff; box-shadow: 0 0 45px rgba(255, 107, 33, 0.65); }
        .btn-red {
            background: rgba(255, 255, 255, 0.05); border: 2.5px solid rgba(255,255,255,.5); color: #fff;
            letter-spacing: 2px; transition: all 0.3s;
            position: relative;
            z-index: 10;
        }
        .btn-red:active { background: #fff; color: var(--tourism-ink); }

        .lang-btn {
            background: rgba(34, 26, 20, 0.72);
            border: 1.5px solid rgba(255, 107, 33, 0.34);
            color: #d6c6bb;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: var(--ai-cyan);
            color: #fff;
            border-color: var(--ai-cyan);
            box-shadow: 0 0 12px rgba(255, 107, 33, 0.5);
        }
        .tourism-logo {
            width: min(44vw, 300px);
            height: auto;
            display: block;
        }
        .text-ai-cyan { color: #ff8a4d !important; }
        .text-ai-pink { color: #ffc400 !important; }
        .border-ai-cyan { border-color: var(--tourism-orange) !important; }
        .bg-ai-cyan\/10 { background-color: rgba(255, 107, 33, 0.10) !important; }
        .bg-ai-cyan\/20 { background-color: rgba(255, 107, 33, 0.20) !important; }

<body class="cyber-bg text-white min-h-[100dvh] w-screen flex flex-col">

        Babel.registerPreset('tourism-react', {presets:[[Babel.availablePresets.react, {runtime:'classic'}]]});

    <script type="text/babel" data-presets="tourism-react">
        const { useState, useEffect, useRef } = React;
        const API_BASE_URL = "https://aicameraliveprint-back.onrender.com";

        function WaitingPortrait({lang, progress}) {
            const host = useRef(null);
            const ui = useRef(null);
            const display = useRef(null);
            if (!display.current) display.current = TourismProgress.createDisplayProgress();
            useEffect(() => {
                ui.current = TourismProgress.mount(host.current, lang, display.current);
                return () => ui.current.dispose();
            }, [lang]);
            useEffect(() => { ui.current.update(progress); }, [progress, lang]);
            return <div ref={host} className="w-full" />;
        }

        // 多語系字典 (Traditional Chinese, English, Japanese)

                styleB: "【 スタイル B 】",
                discardBtn: "キャンセル",
                confirmBtn: "このキャラクターにする",
                processing: "お待ちください…",
                submittedTitle: "受付が完了しました！",
                submittedSub: "選択が完了しました",
                queueLabel: "受付番号",
                scanLabel: "QRコードから画像を保存",
                scanGuide: "スマホのカメラでQRコードを読み取ってください",
                autoReturn: "秒後にホームに戻ります",

            },
            en: {

                bagLabel: "Your Printed Bag",
                startBtn: "Get Started",
                startSub: "Tap to start",
                homeBtn: "Home",
                takePhotoBtn: "Take a Photo",
                cancelBtn: "Cancel",
                cancelSub: "Back to Home",
                pickStyleTitle: "✨ Choose Your Favorite Look ✨",
                styleA: "【 Style A 】",
                styleB: "【 Style B 】",
                discardBtn: "Cancel",
                confirmBtn: "Choose This Look",
                processing: "Please wait…",
                submittedTitle: "All Done!",
                submittedSub: "Picture selected",
                queueLabel: "YOUR NUMBER",
                scanLabel: "Scan to Save Your Picture",
                scanGuide: "Open your phone camera and scan the QR code.",
                autoReturn: "seconds until the home screen",
                loadingTexts: [
                    "Getting ready…",
                    "Checking your photo…",
                    "Creating your character…",
                    "Adding the details…",
                    "Making two styles…"
                ],
                loadingSubTexts: [
                    "Please wait…",
                    "Working on your picture…",
                    "Checking your photo…",
                    "Creating your character…",
                    "Adding the final touches…"
                ]
            }
        };

        const App = () => {
            const [step, setStep] = useState('home');
            const [lang, setLang] = useState('zh'); // 🌟 預設語言改為繁體中文 'zh'
            const [taskId, setTaskId] = useState(null);
            const [imgA, setImgA] = useState(null);
            const [imgB, setImgB] = useState(null);
            const [selectedChoice, setSelectedChoice] = useState(null);
            const [cameraError, setCameraError] = useState(false);

            const t = TRANSLATIONS[lang];

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const qrCanvasRef = useRef(null);
            const [countdown, setCountdown] = useState(0);
            const [progress, setProgress] = useState({phase:'uploading', percent:0});
            const monitorRef = useRef(null);
            const requestRef = useRef(null);
            const captureTimerRef = useRef(null);
            const cameraAttemptRef = useRef(0);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [stream, setStream] = useState(null);
            const [returnCountdown, setReturnCountdown] = useState(15);

            const startCamera = async () => {
                const attempt = ++cameraAttemptRef.current;
                try {
                    setCameraError(false);
                    const mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    if (attempt !== cameraAttemptRef.current) { mediaStream.getTracks().forEach(track => track.stop()); return; }
                    setStream(mediaStream);
                    setStep('camera');
                } catch (err) {
                    if (attempt === cameraAttemptRef.current) setCameraError(true);
                }
            };

            useEffect(() => {
                if (step === 'camera' && stream && videoRef.current) {
                    videoRef.current.srcObject = stream;
                    videoRef.current.play().catch(e => console.log("Play error:", e));
                }
            }, [step, stream]);

            const takePhoto = () => {
                if (countdown > 0 || captureTimerRef.current) return;
                setCountdown(3);
                let count = 3;
                captureTimerRef.current = setInterval(() => {
                    count -= 1;
                    setCountdown(count);
                    if (count === 0) {
                        clearInterval(captureTimerRef.current);
                        captureTimerRef.current = null;
                        capture();
                    }
                }, 1000);
            };

            const capture = async () => {
                const video = videoRef.current;
                const canvas = canvasRef.current;
                if (!video || !canvas) return;
                const ctx = canvas.getContext('2d');
                const size = Math.min(video.videoWidth, video.videoHeight);

                canvas.width = size; canvas.height = size;
                ctx.translate(size, 0); ctx.scale(-1, 1);
                ctx.drawImage(video, (video.videoWidth - size) / 2, (video.videoHeight - size) / 2, size, size, 0, 0, size, size);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                if (stream) stream.getTracks().forEach(t => t.stop());
                setStream(null);
                setStep('loading');
                setTaskId(null);
                setProgress({phase:'uploading', percent:0});
                setSelectedChoice(null);
                const request = new AbortController();
                requestRef.current = request;
                const timeout = setTimeout(() => request.abort(), 60000);
                try {
                    const res = await fetch(API_BASE_URL + "/api/upload", {
                        method: 'POST', signal:request.signal,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: dataUrl })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success || !data.taskId) throw new Error('Upload not confirmed');
                    if (requestRef.current !== request) return;
                    setTaskId(data.taskId);
                    setProgress({phase:'pending', percent:25});
                } catch (err) {
                    if (requestRef.current === request) setProgress({phase:'failed', percent:0});
                } finally {
                    clearTimeout(timeout);
                    if (requestRef.current === request) requestRef.current = null;
                }
            };

            const finalizeChoice = async () => {
                if (!selectedChoice) return;
                setIsSubmitting(true);

                try {
                    const response = await fetch(API_BASE_URL + "/api/choice/" + taskId, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ choice: selectedChoice })
                    });
                    await response.json();
                } catch(e) {
                    console.error("回傳選擇失敗", e);
                }

                setIsSubmitting(false);
                setReturnCountdown(15);
                setStep('completed');
            };

            const handleCancelAndGoHome = () => {
                cameraAttemptRef.current++;
                if (monitorRef.current) monitorRef.current.stop();
                if (requestRef.current) { requestRef.current.abort(); requestRef.current = null; }
                clearInterval(captureTimerRef.current);
                captureTimerRef.current = null;
                setCountdown(0);
                if (stream) stream.getTracks().forEach(t => t.stop());
                setStream(null);
                setTaskId(null);
                setCameraError(false);
                setStep('home');
            };

            useEffect(() => {
                if (step === 'completed' && taskId && qrCanvasRef.current) {
                    const basePath = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
                    const downloadUrl = `${basePath}download.html?taskId=${taskId}&lang=${lang}`;

                    new QRious({
                        element: qrCanvasRef.current,
                        value: downloadUrl,
                        size: 200,
                        background: '#ffffff',
                        foreground: '#020617',
                        level: 'H'
                    });
                }
            }, [step, taskId, lang]);

            useEffect(() => {
                let returnTimer;
                if (step === 'completed' && returnCountdown > 0) {
                    returnTimer = setTimeout(() => {
                        setReturnCountdown(prev => prev - 1);
                    }, 1000);
                } else if (step === 'completed' && returnCountdown === 0) {
                    handleCancelAndGoHome();
                }
                return () => clearTimeout(returnTimer);
            }, [step, returnCountdown]);

            useEffect(() => {
                if (step !== 'loading' || !taskId) return;
                const monitor = TourismProgress.monitor({
                    apiBase:API_BASE_URL, taskId,
                    onProgress:setProgress,
                    onFailure:() => {},
                    onReady:data => {
                        setImgA(data.resultImageA); setImgB(data.resultImageB);
                        setStep('choice');
                    }
                });
                monitorRef.current = monitor;
                return () => monitor.stop();
            }, [step, taskId]);

            return (
                <div className="flex flex-col items-center justify-between min-h-[100dvh] w-full pt-3 pb-8 px-6">

                    {/* Header - 臺灣觀光品牌識別與多國語言切換 */}
                    <div className="text-center z-20 flex flex-col items-center flex-shrink-0 w-full pt-1 relative">
                        <div className="tourism-event-title">2026 觀光產業數位博覽會</div>
                        <div className="tourism-color-ribbon" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

                        {/* 🌐 多國語言切換 (切換繁中 / 日本語 / English) */}
                        <div className="tourism-language absolute right-0 top-0 flex items-center gap-1.5 bg-stone-950/80 p-1 rounded-full border border-orange-400/30 shadow-lg backdrop-blur-md">
                            <button onClick={() => setLang('zh')} className={`lang-btn ${lang === 'zh' ? 'active' : ''}`}>繁中</button>
                            <button onClick={() => setLang('jp')} className={`lang-btn ${lang === 'jp' ? 'active' : ''}`}>日本語</button>
                            <button onClick={() => setLang('en')} className={`lang-btn ${lang === 'en' ? 'active' : ''}`}>EN</button>
                        </div>
                    </div>

                    {/* 互動內容控制中樞 */}
                    <div className="content-container z-10">

                        {step === 'home' && (
                            <div className="tourism-home text-center mt-2 sm:mt-6 flex flex-col items-center justify-start w-full">
                                <p className="text-ai-cyan text-xl sm:text-3xl md:text-4xl mb-3 tracking-[0.2em] text-glow-pulse font-bold">
                                    {t.title}
                                </p>
                                <p className="text-ai-pink text-xl sm:text-2xl md:text-3xl tracking-[0.2em] font-black mb-12 drop-shadow-[0_0_15px_rgba(255,196,0,0.8)]">
                                    <i className="fa-solid fa-gift mr-3 text-white/90"></i>{t.giftTitle}
                                </p>

                                <div className="tourism-home-examples flex flex-row items-center justify-center gap-6 sm:gap-12 mb-16 w-full max-w-[800px] px-4">
                                    <div className="flex flex-col items-center">
                                        <div className="tourism-example-image w-36 h-36 sm:w-56 sm:h-56 rounded-[2rem] overflow-hidden border-2 border-ai-cyan shadow-[0_0_25px_rgba(255,107,33,0.2)] mb-4 bg-[#0f172a]/50 p-2">
                                            <img
                                                src="https://img.shoplineapp.com/media/image_clips/6a1ef28ef1bda7070f35eecc/original.png?1780413070=&owner_id=66221c5c384dbb002ec45c18"
                                                className="w-full h-full object-contain"
                                                alt="Your AI Character"
                                            />
                                        </div>
                                        <span className="text-ai-cyan font-black tracking-wider text-sm sm:text-xl drop-shadow-md">{t.avatarLabel}</span>
                                    </div>

                                    <div className="flex flex-col items-center pb-8 animate-pulse">
                                        <i className="fa-solid fa-arrow-right-long text-ai-pink text-2xl sm:text-4xl drop-shadow-[0_0_10px_rgba(255,196,0,0.6)]"></i>
                                    </div>

                                    <div className="flex flex-col items-center">
                                        <div className="tourism-example-image w-36 h-36 sm:w-56 sm:h-56 rounded-[2rem] overflow-hidden border-2 border-white shadow-[0_0_25px_rgba(255,255,255,0.2)] mb-4 bg-[#0f172a]/50 p-2">
                                            <img
                                                src="https://img.shoplineapp.com/media/image_clips/6a1ef3c33ce472c30e346dac/original.png?1780413379=&owner_id=66221c5c384dbb002ec45c18"
                                                className="w-full h-full object-contain"
                                                alt="Live Bag Printing"
                                            />
                                        </div>
                                        <span className="text-white font-black tracking-wider text-sm sm:text-xl drop-shadow-md">{t.bagLabel}</span>
                                    </div>
                                </div>

                                <button onClick={startCamera} className="btn-cyan text-xl sm:text-3xl md:text-4xl font-black px-12 py-6 sm:py-8 rounded-full animate-pulse shadow-[0_0_35px_rgba(255,107,33,0.4)] flex flex-col items-center gap-1">
                                    <span>{t.startBtn}</span>
                                </button>
                                <div className="tourism-brand tourism-home-logo">
                                    <img src="assets/taiwan-logo.jpg" alt="Taiwan — Waves of Wonder" />
                                </div>
                            </div>
                        )}

                        {step === 'camera' && (
                            <div className="flex flex-col items-center w-full">
                                <div className="camera-container">
                                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover absolute inset-0" style={{ transform: 'rotateY(180deg)' }} />
                                    <div className="face-guide"></div>
                                    {countdown > 0 && (
                                        <div className="absolute top-6 right-6 w-24 h-24 rounded-2xl border-2 border-ai-cyan bg-[#020617]/95 flex flex-col items-center justify-center shadow-[0_0_20px_rgba(255,107,33,0.4)]">
                                            <span className="text-[44px] font-black text-white font-mono">{countdown}</span>
                                        </div>
                                    )}
                                </div>
                                <div className="mt-8 flex gap-6 w-[85vw] sm:w-[80vw] max-w-[500px] sm:max-w-[750px] px-2">
                                    <button onClick={handleCancelAndGoHome} className="btn-cyan flex-1 py-4 sm:py-5 rounded-2xl text-base sm:text-xl font-bold flex flex-col items-center justify-center leading-tight">
                                        <span>{t.homeBtn}</span>
                                    </button>
                                    <button onClick={takePhoto} className="btn-cyan flex-[2.5] py-4 sm:py-5 rounded-2xl text-xl sm:text-3xl font-black bg-ai-cyan/20 shadow-[0_0_20px_rgba(255,107,33,0.3)] flex flex-col items-center justify-center leading-tight">
                                        <span>{t.takePhotoBtn}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 'loading' && (
                            <div className="flex flex-col items-center justify-center w-full max-w-2xl">
                                <WaitingPortrait lang={lang} progress={progress} />
                                {taskId && (
                                    <div className="bg-black/40 p-5 sm:p-6 rounded-3xl border-2 border-ai-cyan text-center w-72 shadow-[0_0_30px_rgba(255,107,33,0.2)] mb-6">
                                        <p className="text-[10px] sm:text-[12px] text-slate-400 font-mono tracking-wider">YOUR NUMBER</p>
                                        <p className="text-4xl sm:text-5xl font-mono font-black text-ai-cyan">#{taskId}</p>
                                    </div>
                                )}
                                <button onClick={handleCancelAndGoHome} className="btn-red px-8 py-3.5 rounded-2xl text-xs sm:text-base font-bold flex flex-col items-center justify-center">
                                    <span>{t.cancelBtn}</span>
                                </button>
                            </div>
                        )}

                        {step === 'choice' && (
                            <div className="flex flex-col items-center w-full max-w-[1000px] px-4">
                                <div className="text-center mb-6">
                                    <p className="text-ai-cyan text-lg sm:text-2xl font-bold tracking-widest animate-pulse">{t.pickStyleTitle}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-6 w-full mb-8">
                                    <div onClick={() => setSelectedChoice('A')} className={`choice-card p-3 rounded-3xl text-center ${selectedChoice === 'A' ? 'selected' : ''}`}>
                                        <img src={imgA} className="w-full aspect-square object-cover rounded-2xl mb-3 border border-slate-800" alt="Style A" />
                                        <span className="text-sm sm:text-2xl font-black tracking-wider block">{t.styleA}</span>
                                    </div>
                                    <div onClick={() => setSelectedChoice('B')} className={`choice-card p-3 rounded-3xl text-center ${selectedChoice === 'B' ? 'selected' : ''}`}>
                                        <img src={imgB} className="w-full aspect-square object-cover rounded-2xl mb-3 border border-slate-800" alt="Style B" />
                                        <span className="text-sm sm:text-2xl font-black tracking-wider block">{t.styleB}</span>
                                    </div>
                                </div>
                                <div className="flex gap-6 w-full sm:max-w-[700px]">
                                    <button onClick={handleCancelAndGoHome} className="btn-cyan flex-1 py-4 rounded-2xl text-xs sm:text-xl font-bold flex flex-col items-center justify-center">
                                        <span>{t.discardBtn}</span>
                                    </button>
                                    <button
                                        disabled={!selectedChoice || isSubmitting}
                                        onClick={finalizeChoice}
                                        className={`flex-[2.5] py-4 rounded-2xl text-base sm:text-2xl font-black transition-all duration-300 flex flex-col items-center justify-center ${
                                            selectedChoice
                                                ? 'btn-cyan bg-cyan-400 text-slate-950 shadow-[0_0_35px_rgba(255,107,33,0.5)]'
                                                : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                        }`}
                                    >
                                        <span><i className="fa-solid fa-check mr-2"></i>{isSubmitting ? t.processing : t.confirmBtn}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 'completed' && (
                            <div className="flex flex-col items-center w-full max-w-[850px] px-4 text-center">
                                <h2 className="text-3xl sm:text-5xl font-black text-ai-cyan tracking-widest mb-6 animate-pulse">{t.submittedTitle}</h2>

                                <div className="bg-[#0f172a]/85 border-2 border-ai-cyan p-6 sm:p-8 rounded-[2.5rem] w-full mb-6 shadow-[0_0_45px_rgba(255,107,33,0.3)] flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12">

                                    <div className="flex flex-col items-center">
                                        <img src={selectedChoice === 'A' ? imgA : imgB} className="w-48 h-48 sm:w-64 sm:h-64 object-cover rounded-3xl mb-4 border-2 border-slate-700 shadow-lg" alt="Selected Style" />
                                        <p className="text-xs sm:text-sm text-slate-400 tracking-[0.2em] font-bold">{t.queueLabel}</p>
                                        <p className="text-5xl sm:text-7xl font-black text-white font-mono drop-shadow-[0_0_20px_#ff6b21]">#{taskId}</p>
                                    </div>

                                    <div className="flex flex-col items-center bg-slate-900/60 p-5 rounded-3xl border border-slate-700 w-full max-w-[280px]">
                                        <div className="p-3 bg-white rounded-2xl shadow-[0_0_20px_rgba(255,255,255,0.15)] flex items-center justify-center mb-3">
                                            <canvas ref={qrCanvasRef} className="w-40 h-40 object-contain"></canvas>
                                        </div>
                                        <span className="text-ai-cyan text-sm sm:text-base font-black tracking-widest mb-1">
                                            <i className="fa-solid fa-mobile-screen-button mr-1.5 animate-bounce"></i> {t.scanLabel}
                                        </span>
                                        <span className="text-[10px] sm:text-[11px] text-slate-400">{t.scanGuide}</span>
                                    </div>

                                </div>

                                <div className="flex items-center justify-center gap-3 text-ai-cyan text-sm sm:text-xl font-bold tracking-widest bg-ai-cyan/10 px-6 py-3.5 rounded-full border border-ai-cyan/30 shadow-inner max-w-md mx-auto">
                                    <i className="fa-solid fa-spinner animate-spin text-lg sm:text-xl"></i>
                                    <span>{returnCountdown} {t.autoReturn}</span>
                                </div>
                            </div>
                        )}

                    </div>

                    {cameraError && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border-2 border-rose-500 rounded-3xl p-8 max-w-md w-full text-center shadow-[0_0_45px_rgba(239,68,68,0.5)]">
                                <div className="w-20 h-20 rounded-full bg-rose-500/10 border-2 border-rose-500 flex items-center justify-center mx-auto mb-6 text-rose-500 text-4xl animate-bounce">
                                    <i className="fa-solid fa-camera"></i>
                                </div>
                                <h3 className="text-2xl font-black text-white mb-2">{lang === 'en' ? 'Please Allow Camera Access' : lang === 'jp' ? 'カメラの使用を許可してください' : '請開通相機權限'}</h3>
                                <p className="text-slate-400 text-sm leading-relaxed mb-6">
                                    {lang === 'zh' && <>機台偵測不到視訊鏡頭。請點擊瀏覽器網址列旁的「鎖頭」圖示，並將相機存取權限設為「允許」。<br/></>}
                                    <span className="text-xs font-mono text-rose-400 block mt-2">{lang === 'jp' ? 'ブラウザの設定でカメラの使用を許可してください。お困りの場合はスタッフにお声がけください。' : 'Allow camera access in your browser settings, or ask our staff for help.'}</span>
                                </p>
                                <button onClick={() => setCameraError(false)} className="btn-cyan w-full py-4 rounded-2xl font-black text-lg">
                                    {lang === 'en' || lang === 'jp' ? 'OK' : '確認 / OK'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <div className="w-full flex flex-col items-center justify-center gap-2 pt-2 z-10">
                        <div
                            onClick={handleCancelAndGoHome}
                            className="w-full text-center opacity-40 text-xs sm:text-sm font-mono text-ai-cyan tracking-widest cursor-default select-none active:text-white transition-colors duration-150"
                            title="工作人員專用跳轉 / Staff Reset"
                        >
                            2026
                        </div>
                    </div>
                    <canvas ref={canvasRef} className="hidden"></canvas>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
