<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta name="peyson-version" content="innoserve-download-v2">
  <title>角色圖片下載 | AI 人像體驗</title>
  <style>
    :root { color-scheme:light; --ink:#243c35; --muted:#63736e; --green:#26705b; --line:#dce6e1; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP","Microsoft JhengHei",sans-serif; line-height:1.6; }
    .page { width:min(100%,480px); min-height:100vh; min-height:100dvh; margin:0 auto; padding:32px 20px 24px; padding-bottom:max(24px,env(safe-area-inset-bottom)); }
    .page-header { text-align:center; margin:0 0 24px; }
    .experience-title { margin:0; font-size:clamp(21px,5.5vw,27px); font-weight:750; letter-spacing:.12em; }
    .experience-en { display:block; margin-top:5px; color:var(--muted); font-size:10px; letter-spacing:.17em; }
    .header-rule { width:32px; height:3px; border-radius:4px; background:#b4cec1; margin:20px auto 16px; }
    h1 { margin:0; font-size:clamp(20px,5.5vw,25px); font-weight:700; letter-spacing:.06em; }
    .subtitle { margin:4px 0 0; font-size:12px; color:var(--muted); }
    .portrait-card { padding:24px clamp(16px,5vw,28px); border:1px solid var(--line); border-radius:24px; background:#fff; text-align:center; box-shadow:0 10px 32px #243c3507; }
    .number-label { display:block; color:var(--muted); font-size:10px; letter-spacing:.18em; }
    .number { display:block; color:var(--green); font-size:clamp(34px,10vw,44px); font-weight:750; font-variant-numeric:tabular-nums; line-height:1.25; margin:3px 0 20px; }
    .portrait-stage { position:relative; width:100%; aspect-ratio:1; border:1px solid #e8eeeb; border-radius:18px; overflow:hidden; background:#fafcfb; display:flex; align-items:center; justify-content:center; }
    #portrait-img { display:block; width:100%; height:100%; object-fit:contain; }
    #loading-spinner { position:absolute; inset:0; padding:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:13px; color:var(--muted); }
    #spinner-text-en { font-size:11px; }
    .save-guide { margin:22px 0 18px; }
    #guide-text-1 { font-weight:650; font-size:15px; margin:0 0 6px; color:var(--green); }
    #guide-text-2 { font-size:12px; margin:0; color:var(--muted); overflow-wrap:anywhere; }
    .device-note { color:#7e8b85; font-size:10px; margin:7px 0 0; }
    #download-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; width:100%; min-height:66px; padding:13px 16px; border:0; border-radius:15px; background:var(--green); color:white; font:inherit; font-size:18px; font-weight:700; cursor:pointer; touch-action:manipulation; }
    #download-btn:not(:disabled):hover { background:#1c5b48; }
    #download-btn:not(:disabled):active { transform:translateY(1px); }
    #download-btn:focus-visible { outline:3px solid #81b3a1; outline-offset:4px; }
    #download-btn:disabled { background:#e4ebe7; color:#84938c; cursor:not-allowed; }
    .button-en { font-size:10px; font-weight:500; letter-spacing:.15em; opacity:.85; }
    .page-footer { text-align:center; margin-top:30px; }
    .medical-partners { display:grid; grid-template-columns:1.55fr 1fr 1fr; gap:18px; align-items:center; width:100%; padding:18px 0 22px; border-bottom:1px solid #edf1ee; }
    .medical-partners img { display:block; width:100%; height:clamp(50px,15vw,70px); object-fit:contain; }
    .credit { margin:18px 0 4px; color:var(--muted); font-size:11px; letter-spacing:.1em; }
    .copyright { margin:0; color:#8a968f; font-size:9px; letter-spacing:.06em; }
    .hidden,[hidden] { display:none !important; }
    .fa-solid { display:inline-block; font-style:normal; }
    .fa-download::before { content:"↓"; margin-right:7px; font-size:1.1em; }
    .fa-hand-pointer::before { content:"☝"; margin-right:5px; }
    .fa-triangle-exclamation::before { content:"!"; display:inline-grid; place-items:center; border:1px solid currentColor; border-radius:50%; width:28px; height:28px; font-weight:700; }
    .fa-spinner { width:28px; height:28px; border:3px solid #dce6e1; border-top-color:var(--green); border-radius:50%; margin-bottom:5px; animation:spin 1s linear infinite; }
    .text-rose-400,.text-rose-500 { color:#9a4848; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(prefers-reduced-motion:reduce) { .fa-spinner { animation:none; } }
    @media(max-width:350px) { .page { padding:24px 14px; }.medical-partners { gap:12px; } }
  
/* Updated event artwork, kept at the supplied aspect ratios. */
.event-brand{display:flex;flex-direction:row;align-items:center;gap:clamp(8px,2vw,20px);width:100%;background:#fff}
.event-brand img.event-brand-logo{display:block;flex:0 0 20%;width:20%;max-width:180px;height:auto;margin:0;object-fit:contain}
.event-brand .event-brand-title{flex:1 1 0;min-width:0;width:auto;padding:0;background:#fff;box-sizing:border-box;border-radius:4px}
.event-brand .event-brand-title img{display:block;width:100%;height:auto;margin:0;object-fit:contain}
.screenshot-note{color:#f5da69!important;white-space:nowrap}
@media(max-width:600px){.event-brand{gap:8px}.event-brand .event-brand-title{padding:0}.event-brand img.event-brand-logo{width:20%}}

.page-header>.event-brand{padding:18px;border:2px solid #f5da69;border-radius:18px;margin-bottom:24px;box-sizing:border-box}

.event-brand.unlock-brand{display:flex;flex-direction:column;gap:0;width:100%;background:#fff}
.event-brand.unlock-brand img{display:block;width:100%;max-width:none;height:auto;flex:none;object-fit:contain}
</style>
<style>
body{background:#133139;color:#fff}.event-logo{width:100%;height:auto;border-radius:12px;margin:0 0 24px}.page-header h1,.page-header p{color:#fff}.header-rule{background:#f5da69}.portrait-card{color:#17363e;border:2px solid #f5da69}#download-btn{background:#f5da69;color:#17363e}#download-btn:not(:disabled):hover{background:#ffe998}.medical-partners{grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-radius:12px;padding:16px 12px;gap:12px;box-sizing:border-box}.medical-partners img{height:60px;width:100%;object-fit:contain}

.event-brand.unlock-brand{display:flex;flex-direction:column;gap:0;width:100%;background:#fff}
.event-brand.unlock-brand img{display:block;width:100%;max-width:none;height:auto;flex:none;object-fit:contain}
</style></head>
<body>
  <div class="page">
    <header class="page-header"><div class="event-brand unlock-brand"><img class="unlock-title" src="assets/unlock-ai/title.jpg" alt="解鎖AI實踐力 育見AI新世代" /><img class="unlock-subtitle" src="assets/unlock-ai/subtitle.jpg" alt="2026 Artificial Intelligence (AI) Teaching Practice Project" /></div>
      <p class="experience-title">AI 人像體驗</p>
      <span class="experience-en">AI PORTRAIT EXPERIENCE</span>
      <div class="header-rule" aria-hidden="true"></div>
      <h1 id="header-title">角色圖片下載</h1>
      <p class="subtitle">Save Your Picture</p>
    </header>
    <main>
      <section class="portrait-card" aria-labelledby="header-title">
        <span class="number-label">YOUR NUMBER</span>
        <span id="display-task-id" class="number">#---</span>
        <div class="portrait-stage">
          <div id="loading-spinner" role="status" aria-live="polite">
            <i class="fa-solid fa-spinner" aria-hidden="true"></i>
            <span id="spinner-text-zh">正在載入您的角色圖片…</span>
            <span id="spinner-text-en">Loading your picture…</span>
          </div>
          <img id="portrait-img" class="hidden" alt="AI Character" />
        </div>
        <div class="save-guide">
          <p id="guide-text-1">長按上方圖片即可儲存</p>
          <p id="guide-text-2">Touch and hold the picture to save it / 画像を長押しして保存</p>
          <p class="device-note">iOS (Safari/LINE/WeChat) &amp; Android</p>
        </div>
        <button id="download-btn" type="button" disabled>
          <span id="btn-text-main"><i class="fa-solid fa-download" aria-hidden="true"></i>一鍵下載檔案</span>
          <span class="button-en">SAVE PICTURE</span>
        </button>
      </section>
    </main>
    <footer class="page-footer">
      
      <p class="credit">PEYSON LIVE PRINT</p>
      <p class="copyright">2026 ALL RIGHTS RESERVED</p>
    </footer>
  </div>
  <script>
        const API_BASE_URL = "https://aicameraliveprint-back.onrender.com";
        let loadAttempts = 0;

        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('taskId');
        const langParam = urlParams.get('lang');

        // 自動檢測手機語系是否為日文
        const isJapanese = false;
        const isEnglish = langParam ? langParam === 'en' : navigator.language.startsWith('en');
        if (isEnglish) {
            document.documentElement.lang = 'en';
            document.getElementById('header-title').innerText = 'Save Your Picture';
            document.getElementById('spinner-text-zh').innerText = 'Loading your picture…';
            document.getElementById('spinner-text-en').hidden = true;
            document.getElementById('guide-text-1').innerText = 'Touch and hold the picture to save it.';
            document.getElementById('guide-text-2').innerText = 'Or tap the button below.';
            document.getElementById('btn-text-main').innerText = 'Save Picture';
        }

        if (isJapanese) {
            document.documentElement.lang = "ja";
            document.getElementById('spinner-text-en').hidden = true;
            document.getElementById('guide-text-2').innerText = "下のボタンからも保存できます。";
            document.getElementById('header-title').innerText = "キャラクターを保存";
            document.getElementById('spinner-text-zh').innerText = "キャラクターを読み込んでいます…";
            document.getElementById('guide-text-1').innerHTML = `<i class="fa-solid fa-hand-pointer mr-1 animate-bounce"></i> 上の画像を長押しして保存`;
            document.getElementById('btn-text-main').innerHTML = `<i class="fa-solid fa-download mr-1.5"></i> 画像を保存する`;
        }

        const displayIdEl = document.getElementById('display-task-id');
        const portraitImg = document.getElementById('portrait-img');
        const spinner = document.getElementById('loading-spinner');
        const downloadBtn = document.getElementById('download-btn');

        if (taskId && /^\d{1,12}$/.test(taskId)) {
            displayIdEl.innerText = `#${taskId}`;
            fetchPortraitData();
        } else {
            displayIdEl.innerText = "#ERROR";
            spinner.innerHTML = `
                <i class="fa-solid fa-triangle-exclamation text-3xl text-rose-500"></i>
                <span class="text-xs text-rose-400 mt-2 font-bold">${isEnglish ? 'This link is not valid. Please scan the QR code again.' : isJapanese ? 'このリンクは使えません。QRコードをもう一度読み取ってください。' : '網址無效：查無此序號'}</span>
                <span class="text-[10px] text-rose-400 font-mono mt-0.5">Invalid URL / 番号が見つかりません</span>
            `;
        }

        async function fetchPortraitData() {
            try {
                loadAttempts += 1;
                const res = await fetch(`${API_BASE_URL}/api/status/${encodeURIComponent(taskId)}`, {cache: "no-store"});
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();

                if (data.success && data.chosenDesign) {
                    const finalImage = data.chosenDesign === 'A' ? data.resultImageA : data.resultImageB;

                    if (finalImage) {
                        portraitImg.src = `${API_BASE_URL}/api/image/${encodeURIComponent(taskId)}/${data.chosenDesign}`;
                        portraitImg.classList.remove('hidden');
                        spinner.classList.add('hidden');

                        downloadBtn.disabled = false;
                        downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                        downloadBtn.addEventListener('click', async () => {
                            try {
                                const response = await fetch(`${API_BASE_URL}/api/image/${encodeURIComponent(taskId)}/${data.chosenDesign}`);
                                if (!response.ok) throw new Error('圖片下載失敗');
                                const blob = await response.blob();
                                const blobUrl = window.URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.style.display = 'none';
                                a.href = blobUrl;
                                a.download = `Portrait_${taskId}.${blob.type === 'image/png' ? 'png' : blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
                                document.body.appendChild(a);
                                a.click();
                                window.URL.revokeObjectURL(blobUrl);
                                document.body.removeChild(a);
                            } catch (e) {
                                window.open(finalImage, '_blank');
                            }
                        });
                    } else {
                        throw new Error("圖片尚未生成完畢");
                    }
                } else {
                    throw new Error("找不到對應的風格或選擇");
                }
            } catch (err) {
                console.error("下載頁讀取失敗，3秒後自動重新嘗試...", err);
                if (loadAttempts < 3) { setTimeout(fetchPortraitData, 3000); }
                else {
                    spinner.textContent = isEnglish ? 'Unable to load. Please reload or ask our staff.' : isJapanese ? '読み込めません。再読み込みするかスタッフにお尋ねください。' : '暫時無法載入，請重新整理或洽現場人員。';
                }
            }
        }
    </script>
</body>
</html>
