<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save Your AI Character | 角色圖片下載</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+TC:wght@300;500;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ai-cyan: #ff6b21;
            --ai-pink: #ffc400;
            --ai-dark: #020617;
        }
        body {
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
            background-color: var(--ai-dark);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        /* 🌟 向上偏移 45px 完美裁切移除背景圖頂部的黑色邊條 */
        .cyber-bg {
            background-image: url('https://img.shoplineapp.com/media/image_clips/6a42074e98a89e001272a13a/original.png?1782712141=&owner_id=66221c5c384dbb002ec45c18');
            background-size: cover;
            background-position: center -45px;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1.5px solid rgba(255, 107, 33, 0.2);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(255, 107, 33, 0.15);
        }
        .glow-button {
            background: linear-gradient(90deg, var(--ai-cyan), #ff9b55);
            color: #020617;
            box-shadow: 0 0 25px rgba(255, 107, 33, 0.4);
            transition: all 0.3s ease;
        }
        .glow-button:active {
            transform: scale(0.96);
            box-shadow: 0 0 35px var(--ai-cyan);
        }
        .shimmer-pulse {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { border-color: rgba(255, 107, 33, 0.2); box-shadow: 0 0 20px rgba(255, 107, 33, 0.1); }
            50% { border-color: rgba(255, 107, 33, 0.6); box-shadow: 0 0 35px rgba(255, 107, 33, 0.3); }
        }
    </style>
    <link rel="stylesheet" href="tourism-theme.css?v=20260907-orange11">
</head>
<body class="text-white">

    <div class="cyber-bg w-full px-6 py-6 flex flex-col justify-between">

        <!-- 頂部霓虹光條標題區 -->
        <header class="text-center w-full flex-shrink-0 mb-4 flex flex-col items-center">
            <div class="tourism-brand"><img src="assets/taiwan-logo.jpg" alt="Taiwan — Waves of Wonder"></div>
            <h1 id="header-title" class="text-2xl font-black tracking-widest text-white drop-shadow-[0_0_10px_rgba(255,107,33,0.4)] pt-2">
                角色圖片下載
            </h1>
            <span class="text-slate-300 text-xs font-mono tracking-wider block mt-1">
                Save Your Picture
            </span>
            <div class="h-[2px] w-24 bg-gradient-to-r from-transparent via-[#ff6b21] to-transparent mx-auto mt-2"></div>
        </header>

        <!-- 核心內容展示區 -->
        <main class="flex-grow flex flex-col items-center justify-center my-auto w-full max-w-sm mx-auto">
            <div class="glass-card rounded-[2.5rem] p-6 w-full text-center flex flex-col items-center relative overflow-hidden">

                <div class="mb-5">
                    <span class="text-[10px] font-mono tracking-widest text-ai-cyan block">YOUR NUMBER</span>
                    <span id="display-task-id" class="text-4xl font-black font-mono tracking-wider text-white">#---</span>
                </div>

                <div class="relative w-56 h-56 sm:w-64 sm:h-64 mb-6 rounded-3xl overflow-hidden border-2 shimmer-pulse flex items-center justify-center bg-black/40">
                    <div id="loading-spinner" class="absolute flex flex-col items-center justify-center text-slate-400 gap-3">
                        <i class="fa-solid fa-spinner animate-spin text-3xl text-ai-cyan"></i>
                        <span id="spinner-text-zh" class="text-xs tracking-wider font-bold">正在載入您的角色圖片…</span>
                        <span id="spinner-text-en" class="text-[10px] font-mono opacity-85">Loading your picture…</span>
                    </div>
                    <img id="portrait-img" class="w-full h-full object-cover hidden" alt="AI Character" />
                </div>

                <div class="mb-4 text-center">
                    <p id="guide-text-1" class="text-ai-cyan font-black text-sm tracking-widest mb-0.5">
                        <i class="fa-solid fa-hand-pointer mr-1 animate-bounce"></i> 長按上方圖片即可儲存
                    </p>
                    <p id="guide-text-2" class="text-slate-300 font-mono text-xs mb-1">
                        Touch and hold the picture to save it / 画像を長押しして保存
                    </p>
                    <p class="text-[9px] text-slate-400">iOS (Safari/LINE/WeChat) & Android</p>
                </div>

                <button id="download-btn" disabled class="glow-button w-full py-4 rounded-2xl font-bold tracking-widest text-sm flex flex-col items-center justify-center gap-0.5 opacity-50 cursor-not-allowed">
                    <span id="btn-text-main"><i class="fa-solid fa-download mr-1.5"></i>一鍵下載檔案</span>
                    <span class="text-[10px] font-mono opacity-80">SAVE PICTURE</span>
                </button>

            </div>
        </main>

        <!-- 底部合作單位 LOGO -->
        <footer class="text-center w-full flex-shrink-0 pt-4 flex flex-col items-center gap-3">
            <div class="flex items-center justify-center gap-3 bg-white/95 px-4 py-1.5 rounded-2xl shadow-[0_0_20px_rgba(255,255,255,0.3)] backdrop-blur-md">
                <span class="text-stone-800 text-sm">PEYSON LIVE PRINT</span>
            </div>
            <p class="text-[8px] font-mono text-ai-cyan">2026 ALL RIGHTS RESERVED</p>
        </footer>

    </div>

    <script>
        const API_BASE_URL = "https://aicameraliveprint-back.onrender.com";

        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('taskId');
        const langParam = urlParams.get('lang');

        // 自動檢測手機語系是否為日文
        const isJapanese = langParam ? langParam === 'jp' : navigator.language.startsWith('ja');
        const isEnglish = langParam ? langParam === 'en' : navigator.language.startsWith('en');
        if (isEnglish) {
            document.documentElement.lang = 'en';
            document.getElementById('header-title').innerText = 'Save Your Picture';
            document.getElementById('spinner-text-zh').innerText = 'Loading your picture…';
            document.getElementById('spinner-text-en').hidden = true;
            document.getElementById('guide-text-1').innerText = 'Touch and hold the picture to save it.';
            document.getElementById('guide-text-2').innerText = 'Or tap the button below.';
            document.getElementById('btn-text-main').innerText = 'Save Picture';
        }

        if (isJapanese) {
            document.documentElement.lang = "ja";
            document.getElementById('spinner-text-en').hidden = true;
            document.getElementById('guide-text-2').innerText = "下のボタンからも保存できます。";
            document.getElementById('header-title').innerText = "キャラクターを保存";
            document.getElementById('spinner-text-zh').innerText = "キャラクターを読み込んでいます…";
            document.getElementById('guide-text-1').innerHTML = `<i class="fa-solid fa-hand-pointer mr-1 animate-bounce"></i> 上の画像を長押しして保存`;
            document.getElementById('btn-text-main').innerHTML = `<i class="fa-solid fa-download mr-1.5"></i> 画像を保存する`;
        }

        const displayIdEl = document.getElementById('display-task-id');
        const portraitImg = document.getElementById('portrait-img');
        const spinner = document.getElementById('loading-spinner');
        const downloadBtn = document.getElementById('download-btn');

        if (taskId) {
            displayIdEl.innerText = `#${taskId}`;
            fetchPortraitData();
        } else {
            displayIdEl.innerText = "#ERROR";
            spinner.innerHTML = `
                <i class="fa-solid fa-triangle-exclamation text-3xl text-rose-500"></i>
                <span class="text-xs text-rose-400 mt-2 font-bold">${isEnglish ? 'This link is not valid. Please scan the QR code again.' : isJapanese ? 'このリンクは使えません。QRコードをもう一度読み取ってください。' : '網址無效：查無此序號'}</span>
                <span class="text-[10px] text-rose-400 font-mono mt-0.5">Invalid URL / 番号が見つかりません</span>
            `;
        }

        async function fetchPortraitData() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/status/${taskId}`);
                const data = await res.json();

                if (data.success && data.chosenDesign) {
                    const finalImage = data.chosenDesign === 'A' ? data.resultImageA : data.resultImageB;

                    if (finalImage) {
                        portraitImg.src = finalImage;
                        portraitImg.classList.remove('hidden');
                        spinner.classList.add('hidden');

                        downloadBtn.disabled = false;
                        downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                        downloadBtn.addEventListener('click', async () => {
                            try {
                                const response = await fetch(finalImage);
                                const blob = await response.blob();
                                const blobUrl = window.URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.style.display = 'none';
                                a.href = blobUrl;
                                a.download = `Portrait_${taskId}.jpg`;
                                document.body.appendChild(a);
                                a.click();
                                window.URL.revokeObjectURL(blobUrl);
                                document.body.removeChild(a);
                            } catch (e) {
                                window.open(finalImage, '_blank');
                            }
                        });
                    } else {
                        throw new Error("圖片尚未生成完畢");
                    }
                } else {
                    throw new Error("找不到對應的風格或選擇");
                }
            } catch (err) {
                console.error("下載頁讀取失敗，3秒後自動重新嘗試...", err);
                setTimeout(fetchPortraitData, 3000);
            }
        }
    </script>
</body>
</html>
